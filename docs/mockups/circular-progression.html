<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Jam · circular progression mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../jam/jam.css">
<!--
  Design mockup only, not wired to the game. The chord progression as a
  clock: the ring stays put, a hand sweeps it once per chorus, the dots on
  the inside are the beats. One colour, cyan: the chord you play is
  filled, the next one only outlined, and over the last beat it fills in
  clockwise, the way the hand goes, while the current one fades.

  Every chord you play leaves its marks on its section of the ring, for
  one lap: a note head where you landed, the colours you added in
  superscript, an inversion as a slash bass, a slur for smooth voice
  leading, the voicing's name on the rim. The game's shout pops out of the
  chord's own section, and the timing gauge sits under the clock.

  The arcade layer, in three takes (?fx=):
    pints    A · the marks burst into pixel coins (gold for the rhythm, red
             for the spice, violet for the voicing) that fill a pint under
             the band. A full pint goes on the bar, four pints and the next
             ghost pops on stage, a clam spills two and can pop one off.
    laser    B · a neon laser zaps the points into the ghosts.
    pinball  C · a ball bounces off the ghosts like bumpers, once per mark.
             A clam tilts the machine.
  (coins and beers, the two halves of pints, still open with ?fx=.)

  On fire, in every take: with the whole band on stage, more points set
  the rim of the clock on fire and score double, until a clam douses it.

  ?tune=autumnal for the real Autumnal in C (the side by side with the
  current screen), ?n=4 for a four chord loop, ?t=<seconds> to freeze.
  The hits are made up (a fixed pattern), only to show the effects.
-->
<style>
  .mock-wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 0.8rem; }
  .mock-tabs { display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .mock-tabs a { font-family: var(--font-display); font-size: 0.55rem; padding: 0.5rem 0.8rem; border: 2px solid var(--line); border-radius: 8px; color: var(--ivory-dim); text-decoration: none; }
  .mock-tabs a.on { border-color: var(--cyan); color: #fff; box-shadow: 0 0 12px rgba(24, 240, 255, 0.5); }
  .mock-title { font-family: var(--font-display); font-size: 0.7rem; color: var(--lime); text-transform: uppercase; letter-spacing: 0.1em; }
  .mock-sub { color: var(--ivory-dim); font-size: 1.1rem; }
  .mock-legend { display: flex; gap: 1.2rem; flex-wrap: wrap; font-family: var(--font-display); font-size: 0.5rem; text-transform: uppercase; letter-spacing: 0.06em; }
  .mock-legend span { display: inline-flex; align-items: center; gap: 0.45rem; }
  .mock-legend:empty { display: none; }
  .rec { position: relative; display: flex; flex-direction: column; gap: 0.8rem; padding: 2.4rem 0 0.4rem; }
  .fx-beers .rec { padding-bottom: 2.2rem; }
  .stage.mock { min-height: 0; padding: 0.8rem 0.8rem 1rem; animation: none; gap: 0.4rem; }
  .wheel { width: min(440px, 100%); display: block; overflow: visible; }
  .mock-gauge { width: min(400px, 92%); }
  .mock-gauge .gt { animation: none; }
  .gr-miss { color: var(--crimson); text-shadow: 0 0 8px var(--crimson); }
  .fx { position: absolute; inset: 0; pointer-events: none; z-index: 5; overflow: visible; }
  .fx svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .ghost-band .ghost-lit { transition: none; }
  .ghost-band .ghost { transform-origin: 50% 90%; }

  .seg { fill: #1d1030; stroke: #4d2f72; stroke-width: 1.5; }
  .seg-next { fill: none; stroke: var(--cyan); stroke-width: 2; filter: drop-shadow(0 0 4px var(--cyan)); }
  .seg-now { fill: rgba(24, 240, 255, 0.3); stroke: var(--cyan); stroke-width: 2.5; filter: drop-shadow(0 0 8px var(--cyan)); }
  .seg-wipe path { fill: rgba(24, 240, 255, 0.3); stroke: none; }
  .seg-flash { stroke-width: 3; }
  .lbl { font-family: var(--font-body); font-size: 28px; text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: #0b0614; stroke-width: 5px; stroke-linejoin: round; }
  .lbl .ext { fill: var(--orange); font-size: 18px; stroke-width: 3px; }
  .slash { font-family: var(--font-body); font-size: 19px; text-anchor: middle; dominant-baseline: central; fill: var(--violet); filter: drop-shadow(0 0 3px var(--violet)); }
  .tag { font-family: var(--font-body); font-size: 15px; text-anchor: middle; dominant-baseline: central; fill: var(--lime); letter-spacing: 0.5px; }
  .slur { fill: none; stroke: var(--lime); stroke-width: 2.2; stroke-linecap: round; filter: drop-shadow(0 0 3px var(--lime)); }
  .tick { fill: #4d2f72; }
  .tick.down { fill: #6d4a99; }
  .tick.lit { fill: #8d6ac0; }
  .note { stroke-width: 1.6; }
  .note-perfect { fill: var(--lime); stroke: var(--lime); filter: drop-shadow(0 0 4px var(--lime)); }
  .note-good { fill: var(--cyan); stroke: var(--cyan); filter: drop-shadow(0 0 4px var(--cyan)); }
  .note-late { fill: var(--orange); stroke: var(--orange); filter: drop-shadow(0 0 4px var(--orange)); }
  .miss-x { stroke: var(--crimson); stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 4px var(--crimson)); }
  .wave { fill: none; stroke-width: 3; }
  .center-chord { font-family: var(--font-body); font-size: 92px; fill: #fff; text-anchor: middle; dominant-baseline: central; }
  .center-count { fill: var(--orange); filter: drop-shadow(0 0 8px var(--orange)); }
  .center-tones { font-family: var(--font-body); font-size: 26px; text-anchor: middle; }
  .center-tones tspan { fill: var(--deg); opacity: 0.6; }
  .center-tones tspan.req { opacity: 1; filter: drop-shadow(0 0 4px var(--deg)); }
  .center-small { font-family: 'Press Start 2P', monospace; font-size: 9px; fill: var(--lime); text-anchor: middle; letter-spacing: 1px; }

  .hand { stroke: #fff; stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 6px var(--cyan)); }
  .hand-tip { fill: #fff; }
  .hand-tip.beat { fill: var(--cyan); }
  .hand-tip.down { fill: var(--pink); }
  .hub { fill: #0b0614; stroke: var(--violet); stroke-width: 2; }

  /* The game's shouts, placed by the mockup. */
  .fx .shout { animation: none; top: 0; left: 0; }
  .px { position: absolute; left: 0; top: 0; width: 8px; height: 8px; margin: -4px 0 0 -4px; }
  .pix { position: absolute; left: 0; top: 0; line-height: 0; }
  .pix svg { position: static; width: auto; height: auto; display: block; }
  .pop { position: absolute; left: 0; top: 0; font-family: var(--font-display); font-size: 0.6rem; white-space: nowrap; text-shadow: 2px 2px 0 #000, 0 0 10px currentColor; }
  .pop.big { font-size: 0.85rem; }
  .ball { position: absolute; left: 0; top: 0; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0 25%, #cfd8f0 45%, #6d6080 100%); }
  .ring { position: absolute; left: 0; top: 0; border-radius: 50%; border: 3px solid; }
  .counter { position: absolute; height: 9px; border-radius: 3px; background: linear-gradient(#9a5a2a, #5a3214); box-shadow: 0 -2px 0 var(--orange), 0 0 14px rgba(255, 159, 28, 0.45); }
  .banner { position: absolute; left: 0; top: 0; font-family: var(--font-display); font-size: 1.9rem; white-space: nowrap; letter-spacing: 0.08em; }
  .banner.fire { color: #ffd23a; text-shadow: 3px 3px 0 #000, 0 0 12px #ff7814, 0 0 30px #ff3b1f; }
  .banner.doused { color: #b9a3d4; text-shadow: 3px 3px 0 #000; font-size: 1.3rem; }
  .flame-ring path { mix-blend-mode: screen; }
  .tilt { position: absolute; left: 0; top: 0; font-family: var(--font-display); font-size: 2.2rem; color: var(--crimson); text-shadow: 4px 4px 0 #000, 0 0 24px var(--crimson); letter-spacing: 0.2em; }
  .fx-beers .ghost-band .ghost.is-off .ghost-dark .sprite { opacity: 0.1; }
</style>
</head>
<body>
<div class="smoke"><span></span><span></span><span></span></div>
<div class="app">
  <div class="mock-wrap">
    <div class="mock-tabs" id="tabs"></div>
    <div class="mock-title" id="mockTitle"></div>
    <div class="mock-sub" id="mockSub"></div>
    <div class="mock-legend" id="legend"></div>
    <div class="tune-bar">
      <div class="tune-info">
        <span id="tuneTitle">Autumnal</span>
        <span class="tune-meta">Swing · G minor · 132 bpm</span>
        <span class="tune-chorus" id="tuneChorus">Chorus 1/4</span>
      </div>
    </div>
    <div class="rec" id="rec">
      <div class="stage mock" id="stage">
        <svg class="wheel" id="wheel" viewBox="-10 0 440 460"></svg>
        <div class="gauge mock-gauge" aria-hidden="true">
          <div class="gauge-track"><div class="gauge-zones" id="gaugeZones"></div><div class="gauge-ticks" id="gaugeTicks"></div><i class="gauge-cursor" id="gaugeCursor" hidden></i></div>
          <div class="gauge-legend"><span>Early</span><span class="gauge-readout" id="gaugeReadout"></span><span>Late</span></div>
        </div>
      </div>
      <div class="bandstand"><div class="ghost-band" id="ghostBand"></div></div>
      <div class="fx" id="fx"></div>
    </div>
  </div>
</div>

<script type="module">
import { sprite } from '../../jam/js/sprites.js';

const q = new URLSearchParams(location.search);
const TAKES = {
  pints: ['A · Pints', 'Coins fill a pint under the band: gold for the rhythm, red for the spice, violet for the voicing. A full pint goes on the bar, four pints and the next ghost pops on stage. A clam spills two. With the whole band on stage, more points set the clock on fire.'],
  coins: ['A · Coins', 'Every chord bursts into coins that home into the ghosts. Gold for the rhythm, red for the spice, violet for the voicing.'],
  laser: ['B · Laser', 'A neon laser zaps each chord\'s points into the ghosts.'],
  beers: ['C · Beers', 'Every chord pours pints that slide down to the band. Four pints and the next ghost pops on stage. A clam spills two, and a ghost can pop off.'],
  pinball: ['C · Pinball', 'Every chord launches a ball that bounces off the ghosts like bumpers, once per mark. A clam tilts the machine.'],
};
const FX = q.get('fx') in TAKES ? q.get('fx') : 'pints';
// Coins and Beers alone are now merged into Pints, still reachable by ?fx=.
const TABS = ['pints', 'laser', 'pinball'];
const keep = [...q].filter(([k]) => k !== 'fx' && k !== 't').map(([k, v]) => `&${k}=${v}`).join('');
document.getElementById('tabs').innerHTML = TABS.map((id) => [id, TAKES[id]])
  .map(([id, [name]]) => `<a href="?fx=${id}${keep}"${id === FX ? ' class="on"' : ''}>${name}</a>`).join('');
document.getElementById('mockTitle').textContent = TAKES[FX][0];
document.getElementById('mockSub').textContent = TAKES[FX][1];
document.body.classList.add(`fx-${FX}`);

const FOUR = q.get('n') === '4';
// ?tune=autumnal plays the real Autumnal in C, as the game does, for the
// side by side with the current screen.
const AUTUMNAL = q.get('tune') === 'autumnal';
const CHORDS = AUTUMNAL ? ['Dm', 'G7', 'Bø', 'E7', 'AmM7']
  : FOUR ? ['Gm7', 'E♭maj7', 'Cm7', 'D7'] : ['Cm7', 'F7', 'B♭maj7', 'E♭maj7', 'Aø7', 'D7', 'Gm', 'Gm'];
if (AUTUMNAL) document.querySelector('.tune-meta').textContent = 'Swing · C major · 132 bpm';
// Chord tones, root first, for the slash bass and the notes in the centre.
const TONES = {
  Cm7: ['C', 'E♭', 'G', 'B♭'], F7: ['F', 'A', 'C', 'E♭'], 'B♭maj7': ['B♭', 'D', 'F', 'A'], 'E♭maj7': ['E♭', 'G', 'B♭', 'D'],
  'Aø7': ['A', 'C', 'E♭', 'G'], D7: ['D', 'F♯', 'A', 'C'], Gm: ['G', 'B♭', 'D'], Gm7: ['G', 'B♭', 'D', 'F'],
  Dm: ['D', 'F', 'A'], G7: ['G', 'B', 'D', 'F'], 'Bø': ['B', 'D', 'F', 'A'], E7: ['E', 'G♯', 'B', 'D'], AmM7: ['A', 'C', 'E', 'G♯'],
};
const N = CHORDS.length;
const BEAT = 60 / 132;
const SLOT = 4 * BEAT;
const READY = 2 * BEAT;           // "Ready" first, like the game
const COUNT_IN = SLOT;            // then one bar of count-in
const T0 = READY + COUNT_IN;      // the first downbeat
let FROZEN = q.has('t') ? parseFloat(q.get('t')) : null;

// Made-up playing, one entry per chord played, cycling. off: beats from
// the downbeat. inv: 1 = 3rd in the bass, 2 = 5th, 3 = 7th.
const PLAY = [
  { grade: 'perfect', off: 0.02, ext: ['9'] },
  { grade: 'good', off: 0.35, inv: 1, smooth: true },
  { grade: 'perfect', off: -0.04, ext: ['9', '13'], tag: 'rootless' },
  { grade: 'late', off: 1.4 },
  { grade: 'perfect', off: 0.05, inv: 2, smooth: true },
  { grade: 'miss' },
  { grade: 'good', off: 0.5, ext: ['13'], tag: 'shell' },
  { grade: 'perfect', off: 0, ext: ['9'], smooth: true },
  { grade: 'perfect', off: 0.03, tag: 'quartal' },
  { grade: 'good', off: 0.25, ext: ['9'], inv: 1 },
  { grade: 'perfect', off: -0.02, smooth: true, ext: ['13'] },
];
// How much each kind of mark lights the ghosts (a ghost is 1).
const VALUE = { perfect: 0.24, good: 0.17, late: 0.07, miss: -0.5, ext: 0.1, inv: 0.1, tag: 0.1 };
const START_HEAT = q.has('heat') ? parseFloat(q.get('heat')) : 2.5;   // like the game: three ghosts on stage at the count-in
// The game's own words, points, timing windows and gauge.
const SHOUTS = {
  perfect: ['In the pocket!', 'Perfect!', 'Tasty!', 'Far out!', 'Righteous!'],
  good: ['Groovy!', 'Nice!', 'Solid!', 'Cool cat!'],
  late: ['Late but legal', 'Dragging…', 'Catch up!'],
  miss: ['Clam!', 'Trainwreck!', 'Who ordered that?', 'Ghosted!'],
};
const POINTS = { perfect: 300, good: 150, late: 50, miss: 0 };
const MARK_POINTS = { ...POINTS, ext: 25, inv: 25, tag: 50 };
const WINDOW = { antic: 0.5, perfect: 0.25, good: 1 };
const GAUGE = { from: -1, to: 1.5 };
const ZONE_WORD = { early: 'Early', perfect: 'On the beat', good: 'A bit late', late: 'Late' };
const GRADE_RGB = { perfect: '182,255,59', good: '24,240,255', late: '255,159,28', miss: '255,59,59' };
const KIND_RGB = { ...GRADE_RGB, ext: '255,159,28', inv: '155,92,255', tag: '182,255,59' };

const svgNS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('wheel');
const CX = 210, CY = 230;
const el = (tag, attrs, parent = svg) => {
  const e = document.createElementNS(svgNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
};
// Angle 0 is twelve o'clock, clockwise.
const pt = (r, a) => [CX + r * Math.sin(a), CY - r * Math.cos(a)];
function arc(r0, r1, a0, a1) {
  const large = a1 - a0 > Math.PI ? 1 : 0;
  const [x0, y0] = pt(r1, a0), [x1, y1] = pt(r1, a1), [x2, y2] = pt(r0, a1), [x3, y3] = pt(r0, a0);
  return `M${x0} ${y0}A${r1} ${r1} 0 ${large} 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 ${large} 0 ${x3} ${y3}Z`;
}
const SPAN = 2 * Math.PI / N;
const GAP = 0.025;
const R0 = 128, R1 = 186, RB = 114, RLBL = 152;
// Where beat b (may be fractional) of chord i sits on the beat track.
const beatAngle = (i, b) => i * SPAN + GAP + (b / 4) * (SPAN - 2 * GAP) + 0.02;
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const smooth = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
const easeOut = (x) => 1 - (1 - clamp01(x)) ** 3;
const easeIn = (x) => clamp01(x) ** 2.2;
// A repeatable "random" number in 0..1 for a seed.
const rnd = (a, b = 0) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
const IDLE = [185, 163, 212], CYAN = [24, 240, 255], WHITE = [255, 255, 255];
const mixColour = (wn, wc) => {
  const wi = Math.max(0, 1 - wn - wc);
  return `rgb(${[0, 1, 2].map((c) => Math.round(IDLE[c] * wi + CYAN[c] * wc + WHITE[c] * wn)).join(',')})`;
};

// ---------- pixel art for the takes ----------
const pix = (rows, pal, px) => {
  let r = '';
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.') r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${pal[ch]}"/>`; }));
  return `<svg viewBox="0 0 ${rows[0].length} ${rows.length}" width="${rows[0].length * px}" height="${rows.length * px}" shape-rendering="crispEdges">${r}</svg>`;
};
// A: three kinds of coin. o rim, f face, g glyph, h shine.
const COINS = {
  rhythm: { // a quaver: you landed it on the beat
    pal: { o: '#8a5200', f: '#ffd23a', g: '#7a4300', h: '#fff7c0' },
    rows: ['..ooooo..', '.offfhfo.', 'offffgffo', 'offffggfo', 'offffgffo', 'offgggffo', 'offggfffo', '.offfffo.', '..ooooo..'] },
  spice: { // a flame: 9ths, 13ths, the colours you added
    pal: { o: '#7a1200', f: '#ff4a1c', g: '#ffd23a', h: '#fff7ff' },
    rows: ['..ooooo..', '.offgffo.', 'offfggffo', 'offgggffo', 'offghggfo', 'offghhgfo', 'offggggfo', '.offfffo.', '..ooooo..'] },
  voicing: { // a stacked chord: inversions, smooth leading, rootless, shells
    pal: { o: '#3a1580', f: '#9b5cff', g: '#fff7ff', h: '#d7c0ff' },
    rows: ['..ooooo..', '.offffgo.', 'offfgggfo', 'offfffgfo', 'offfgggfo', 'offfffgfo', 'offfgggfo', '.offfffo.', '..ooooo..'] },
  miss: { // cracked
    pal: { o: '#4a0a0a', f: '#ff3b3b', g: '#2a0505', h: '#ff9a9a' },
    rows: ['..ooooo..', '.offfffo.', 'offfgfffo', 'offffgffo', 'offfgfffo', 'offffgffo', 'offfgfffo', '.offfffo.', '..ooooo..'] },
};
const CAT = { perfect: 'rhythm', good: 'rhythm', late: 'rhythm', ext: 'spice', inv: 'voicing', tag: 'voicing', miss: 'miss' };
const COIN_N = { perfect: 3, good: 2, late: 1, ext: 2, inv: 2, tag: 2, miss: 3 };
const CAT_RGB = { rhythm: '255,210,58', spice: '255,74,28', voicing: '155,92,255', miss: '255,59,59' };
const coinSvg = {};
for (const c in COINS) coinSvg[c] = pix(COINS[c].rows, COINS[c].pal, 3);
if (FX === 'coins' || FX === 'pints') {
  document.getElementById('legend').innerHTML = [['rhythm', 'Rhythm'], ['spice', 'Spice'], ['voicing', 'Voicing']]
    .map(([c, w]) => `<span style="color:rgb(${CAT_RGB[c]})">${pix(COINS[c].rows, COINS[c].pal, 2)}${w}</span>`).join('');
}
// C: a pint, from the game's own beer sprite.
const MUG = ['..WWWWWW....', '.WWWWWWWWW..', '.KWWWWWWWK..', '.KAAAAAAAKKK', '.KAYAAAAAK.K', '.KAAAAYAAK.K', '.KAAAAAAAK.K', '.KAYAAAAAKKK', '.KAAAAAYAK..', '.KAAAAAAAK..', '.KKKKKKKKK..'];
const MUG_PAL = { W: '#fff7ff', A: '#ffb000', Y: '#ffe48a', K: '#2a1d3d' };

// ---------- the song: when each chord lands and what it leaves ----------
const slotStart = (s) => T0 + s * SLOT;
const play = (s) => PLAY[s % PLAY.length];
const hitTime = (s) => { const p = play(s); return slotStart(s) + (p.grade === 'miss' ? SLOT * 0.5 : p.off * BEAT); };
const noteAt = (s) => { const p = play(s); return pt(RB, beatAngle(s % N, p.grade === 'miss' ? 0 : Math.max(-0.3, p.off))); };

// The marks of chord s, by kind.
function marksOf(s) {
  const p = play(s);
  if (p.grade === 'miss') return ['miss'];
  return [p.grade, ...(p.ext || []).map(() => 'ext'), ...(p.inv ? ['inv'] : []), ...(p.smooth ? ['tag'] : []), ...(p.tag ? ['tag'] : [])];
}
const pointsOf = (s) => { const p = play(s); return POINTS[p.grade] + (p.ext || []).length * 25 + (p.inv ? 25 : 0) + (p.smooth ? 50 : 0) + (p.tag ? 50 : 0); };
const PINT = 0.25;   // C: a ghost is four pints

// What each chord sends to the ghosts: pieces, each with its kind, its
// value, when it leaves the ring and when it lands. The takes differ.
function deliveries(s) {
  const kinds = marksOf(s), h = hitTime(s), out = [];
  const total = kinds.reduce((a, k) => a + VALUE[k], 0);
  if (FX === 'pints' && kinds[0] === 'miss') return [{ kind: 'miss', j: 0, leave: h + 0.15, land: h + 0.15, value: -2 * PINT, last: true }];
  if (FX === 'coins' || FX === 'pints') {
    // Coins by category, a miss cracks three out of the ghosts.
    let j = 0;
    kinds.forEach((k) => {
      const n = COIN_N[k];
      for (let c = 0; c < n; c++, j++) {
        const leave = h + 0.18 + j * 0.04;
        out.push({ kind: k, j, leave, land: k === 'miss' ? leave : leave + 1.0, value: VALUE[k] / n });
      }
    });
    out[out.length - 1].last = true;
  } else if (FX === 'laser') {
    out.push({ kind: kinds[0], j: 0, leave: h + 0.25, land: h + 0.4, value: total, last: true });
  } else if (FX === 'beers') {
    if (kinds[0] === 'miss') return [{ kind: 'miss', j: 0, leave: h + 0.15, land: h + 0.15, value: -2 * PINT, last: true }];
    const n = Math.max(1, Math.round(total / PINT));
    for (let j = 0; j < n; j++) out.push({ kind: kinds[j % kinds.length], j, leave: h + 0.15 + j * 0.14, land: h + 0.95 + j * 0.14, value: PINT, last: j === n - 1 });
  } else {
    if (kinds[0] === 'miss') return [{ kind: 'miss', j: 0, leave: h + 0.1, land: h + 0.1, value: VALUE.miss, last: true }];

  } else if (fireI > 0) {
    const pulse = 0.6 + 0.4 * Math.sin(t * 2 * Math.PI / BEAT);
    stage.style.boxShadow = `0 0 ${(30 + 30 * pulse) * fireI}px rgba(255,120,20,${(0.7 * fireI).toFixed(2)}), inset 0 0 ${50 * fireI}px rgba(255,90,31,${(0.25 * fireI * pulse).toFixed(2)})`;
    stage.style.transform = '';
  } else { stage.style.boxShadow = ''; stage.style.transform = ''; }

  // The shouts, out of the chord's own section, tilted with the ring.
  for (const s of slotsBefore(t)) {
    const age = t - hitTime(s);
    if (age < 0 || age > 1.2) continue;
    const mid = (s % N + 0.5) * SPAN, [x, y] = toBox(pt(R1 + 30, mid));
    const rot = Math.max(-18, Math.min(18, Math.sin(mid) * 14));
    // Kept on screen on a phone.
    const half = Math.min(box.width * 0.3, 110);
    html += shoutHtml(s, Math.max(half, Math.min(box.width - half, x)), y - 20, rot, age, 0.9);
  }

  // The pieces on their way to the ghosts.
  const landed = [0, 0, 0, 0];
  const jump = (gi, since, dur = 0.35) => { if (since >= 0 && since < dur) landed[gi] = Math.max(landed[gi], 1 - since / dur); };
  for (const d of ALL) {
    if (d.leave > t) break;
    if (t - d.land > 1.2) continue;
    const s = d.s, [ox, oy] = toBox(noteAt(s));
    const rgb = KIND_RGB[d.kind];
    const ia = t - d.land;

    if (FX === 'coins' || (FX === 'pints' && d.kind !== 'miss')) {
      const cat = CAT[d.kind], crgb = CAT_RGB[cat];
      if (d.kind === 'miss') {
        // Cracked coins knocked out of the ghosts, falling off the stage.
        const [ex, ey] = edgeAt(d.before, box), u = (t - d.leave) / 1.0;
        if (u < 0 || u > 1) continue;
        const vx = (rnd(s, d.j) - 0.5) * 160 * scale, vy = -120 * scale;
        const x = ex + vx * u, y = ey + vy * u + 380 * scale * u * u;
        html += `<i class="pix" style="transform:translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-50%) rotate(${(u * 400 * (d.j % 2 ? 1 : -1)).toFixed(0)}deg);opacity:${(1 - u).toFixed(2)};filter:drop-shadow(0 0 6px rgb(${crgb}))">${coinSvg.miss}</i>`;
        if (d.j === 0 && u < 0.5) html += popText(ex, ey - 10, u * 1.0, 0.5, crgb, `-${Math.round(-VALUE.miss * 100)}%`);
        continue;
      }
      // A: into the ghost. Pints: into the glass being filled, or, with
      // the whole band on stage, into the fire.
      let tx, ty, gi;
      if (FX === 'coins') [tx, ty, gi] = edgeAt(d.before + d.value * 0.5, box);
      else if (d.fuel) { [tx, ty] = toBox([CX, CY - 40]); gi = -1; }
      else { const n = Math.min(15, Math.floor(d.before / PINT + 1e-6)); [tx, ty] = pintAt(n, box); ty -= 8 * MUG_PX; gi = -1; }
      if (gi >= 0) jump(gi, ia);
      const u = (t - d.leave) / (d.land - d.leave);
      if (u >= 0 && u <= 1) {
        // Burst out from the note, then get pulled into the ghost, spinning.
        const ang = rnd(s, d.j) * Math.PI * 2, sp = (50 + 60 * rnd(d.j, s)) * scale;
        const bx = ox + Math.cos(ang) * sp, by = oy + Math.sin(ang) * sp - 30 * scale;
        const pos = (uu) => {
          if (uu < 0.3) { const e = easeOut(uu / 0.3); return [ox + (bx - ox) * e, oy + (by - oy) * e]; }
          const e = easeIn((uu - 0.3) / 0.7);
          const cx = bx + (bx < tx ? -40 : 40), cy = by + 40;
          return [(1 - e) ** 2 * bx + 2 * (1 - e) * e * cx + e * e * tx, (1 - e) ** 2 * by + 2 * (1 - e) * e * cy + e * e * ty];
        };
        for (let tr = 3; tr >= 1; tr--) {
          const [x, y] = pos(Math.max(0, u - tr * 0.035));
          html += `<i class="px" style="transform:translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${(0.7 - tr * 0.15).toFixed(2)});background:rgb(${crgb});opacity:${(0.6 - tr * 0.15).toFixed(2)}"></i>`;
        }
        const [x, y] = pos(u);
        const spin = Math.max(0.15, Math.abs(Math.cos(u * 9 + d.j)));
        const sz = u < 0.3 ? 1.1 : 1.1 - 0.4 * (u - 0.3);
        html += `<i class="pix" style="transform:translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-50%) scale(${(spin * sz).toFixed(2)},${sz.toFixed(2)});filter:drop-shadow(0 0 5px rgb(${crgb}))">${coinSvg[cat]}</i>`;
      }
      if (ia >= 0 && ia < 0.35) html += burst(tx, ty, ia, 0.35, d.fuel ? 6 : 4, d.fuel ? '255,120,20' : crgb, s + d.j, scale, d.fuel ? 40 : 24);
      if (d.last && ia >= 0 && ia < 0.6) html += popText(tx, ty - 30, ia, 0.6, d.fuel ? '255,120,20' : '255,210,58', d.fuel ? `+${2 * pointsOf(s)} ×2` : `+${pointsOf(s)}`);
      // A glass filled to the brim: a cheer for the new pint.
      if (FX === 'pints' && !d.fuel && Math.floor(d.after / PINT + 1e-6) > Math.floor(d.before / PINT + 1e-6) && ia >= 0 && ia < 0.4) {
        html += burst(tx, ty, ia, 0.4, 8, '255,228,138', s * 7 + d.j, scale, 30);
      }
    } else if (FX === 'laser') {
      const [tx, ty, gi] = edgeAt(d.before + d.value * 0.5, box);
      jump(gi, ia);
      const u = (t - d.leave) / 0.6;
      if (u >= 0 && u <= 1) {
        // A jagged neon bolt, growing to the ghost then fading.
        const grow = easeOut(u / 0.25), fade = u < 0.5 ? 1 : 1 - (u - 0.5) / 0.5;
        const seg = 9, jitter = Math.floor(t * 30);
        let path = `M${ox} ${oy}`;
        for (let n = 1; n <= seg; n++) {
          const e = (n / seg) * grow;
          const x = ox + (tx - ox) * e, y = oy + (ty - oy) * e;
          const off = n === seg ? 0 : (rnd(jitter, n) - 0.5) * 22 * scale;
          path += ` L${(x + off).toFixed(1)} ${(y + off * 0.4).toFixed(1)}`;
        }
        svgFx += `<path d="${path}" fill="none" stroke="rgb(${rgb})" stroke-width="${7 * fade}" stroke-linejoin="round" opacity="${(0.5 * fade).toFixed(2)}" style="filter:blur(3px)"/>`
          + `<path d="${path}" fill="none" stroke="#fff" stroke-width="${2.5 * fade}" stroke-linejoin="round" opacity="${fade.toFixed(2)}" style="filter:drop-shadow(0 0 6px rgb(${rgb})) drop-shadow(0 0 14px rgb(${rgb}))"/>`;
        // A spark running down the bolt.
        if (u < 0.3) {
          const e = easeOut(u / 0.3);
          html += `<i class="px" style="transform:translate(${(ox + (tx - ox) * e).toFixed(1)}px,${(oy + (ty - oy) * e).toFixed(1)}px) scale(1.4);background:#fff;box-shadow:0 0 14px rgb(${rgb}),0 0 30px rgb(${rgb})"></i>`;
        }
      }
      if (ia >= 0 && ia < 0.5) {
        html += burst(tx, ty, ia, 0.5, 8, rgb, s, scale);
        if (d.value > 0) html += popText(tx, ty - 40, ia, 0.5, rgb, `+${pointsOf(s)}`);
      }
    } else if (PUB) {
      if (d.kind === 'miss') {
        // Spilled: the last two pints tip over and smash.
        for (let c = 0; c < 2; c++) {
          const n = Math.floor(d.before / PINT + 1e-6) - 1 - c;
          if (n < 0) continue;
          const [px0, py0] = pintAt(n, box), u = (t - d.leave) / 0.9;
          if (u < 0 || u > 1) continue;
          const x = px0 + (40 + 30 * c) * scale * u, y = py0 - 50 * scale * u + 260 * scale * u * u;
          html += `<i class="pix" style="transform:translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-100%) rotate(${(120 * easeOut(u * 2)).toFixed(0)}deg);opacity:${(1 - u).toFixed(2)}">${mugSvg}</i>`;
          for (let dr = 0; dr < 5; dr++) {
            const du = clamp01(u * 1.4 - dr * 0.05);
            html += `<i class="px" style="transform:translate(${(px0 + (20 + dr * 12) * scale * du).toFixed(1)}px,${(py0 - 10 * scale - 40 * scale * du + 200 * scale * du * du).toFixed(1)}px) scale(0.6);background:#ffb000;opacity:${(1 - u).toFixed(2)}"></i>`;
          }
        }
        if (ia >= 0 && ia < 0.8) { const [px0, py0] = pintAt(Math.max(0, Math.floor(d.before / PINT + 1e-6) - 1), box); html += popText(px0 + 30 * scale, py0 + 34 * scale, ia, 0.8, '255,59,59', 'Spilled!', true); }
        continue;
      }
      // A pint flies from the note and slams down on the bar.
      const n = Math.round(d.before / PINT);
      if (n >= 16) continue;
      const [tx, ty] = pintAt(n, box);
      const u = (t - d.leave) / (d.land - d.leave);
      if (u >= 0 && u < 1) {
        const e = smooth(u), cx = (ox + tx) / 2 + (ox < tx ? -60 : 60) * scale, cy = Math.min(oy, ty) - 90 * scale;
        const pos = (ee) => [(1 - ee) ** 2 * ox + 2 * (1 - ee) * ee * cx + ee * ee * tx, (1 - ee) ** 2 * oy + 2 * (1 - ee) * ee * cy + ee * ee * ty];
        for (let dr = 1; dr <= 4; dr++) {
          const [x, y] = pos(smooth(Math.max(0, u - dr * 0.04)));
          html += `<i class="px" style="transform:translate(${x.toFixed(1)}px,${(y - 8 * MUG_PX).toFixed(1)}px) scale(${(0.7 - dr * 0.12).toFixed(2)});background:${dr % 2 ? '#fff7ff' : '#ffe48a'};opacity:${(0.8 - dr * 0.15).toFixed(2)}"></i>`;
        }
        const [x, y] = pos(e);
        html += `<i class="pix" style="transform:translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-100%) rotate(${(Math.sin(u * 7 + d.j) * 25 * (1 - u)).toFixed(0)}deg) scale(${(0.8 + 0.4 * Math.sin(Math.PI * u)).toFixed(2)});filter:drop-shadow(0 0 6px rgb(${rgb}))">${mugSvg}</i>`;
      }
      if (ia >= 0 && ia < 0.3) html += burst(tx, ty - 10 * MUG_PX, ia, 0.3, 5, '255,228,138', s + d.j, scale, 20);
      if (d.last && ia >= 0 && ia < 0.6) html += popText(tx, ty - 26 * MUG_PX, ia, 0.6, '255,176,0', `+${pointsOf(s)}`);
    } else {
      // D: pinball.
      if (d.kind === 'miss') {
        // Tilt: the ball drops straight down the drain.
        const u = (t - d.leave) / 0.9;
        if (u >= 0 && u <= 1) html += `<i class="ball" style="transform:translate(${ox.toFixed(1)}px,${(oy + 500 * scale * u * u).toFixed(1)}px);opacity:${(1 - u).toFixed(2)}"></i>`;
        if (ia >= 0 && ia < 1) {
          const [cx, cy] = toBox([CX, CY + 14]);
          html += `<span class="tilt" style="transform:translate(${cx}px,${cy}px) translate(-50%,-50%) scale(${(1 + 0.3 * easeOut(1 - ia * 4)).toFixed(2)});opacity:${(Math.floor(ia * 10) % 2 ? 0.55 : 1) * (ia > 0.75 ? (1 - ia) * 4 : 1)}">TILT</span>`;
        }
        continue;
      }
      // One bumper per mark; the last one is the ghost the heat is reaching.
      const kinds = marksOf(s), pick = (j) => {
        if (j < 0) return -1;
        if (j === kinds.length - 1) return Math.min(3, Math.floor(d.before + d.value * 0.5));
        let g = Math.floor(rnd(s, j + 7) * 4);
        if (g === pick(j - 1)) g = (g + 1) % 4;
        return g;
      };
      if (d.j !== 0) continue;   // the first piece carries the whole ball
      const legs = ALL.filter((x) => x.s === s);
      const pts = [[ox, oy], ...legs.map((x, j) => { const [gx, gy] = ghostAt(pick(j), box, 0.45); return [gx + (rnd(s, j) - 0.5) * 30 * scale, gy]; })];
      const times = [d.leave, ...legs.map((x) => x.land)];
      // The ball, with a short trail.
      const posAt = (tt) => {
        if (tt <= times[0]) return pts[0];
        for (let j = 0; j < legs.length; j++) {
          if (tt <= times[j + 1]) {
            const u = (tt - times[j]) / (times[j + 1] - times[j]);
            const [x0, y0] = pts[j], [x1, y1] = pts[j + 1];
            return [x0 + (x1 - x0) * u, y0 + (y1 - y0) * u - Math.sin(Math.PI * u) * (j === 0 ? 70 : 45) * scale];
          }
        }
        // Drain after the last bumper.
        const u = (tt - times[times.length - 1]) / 0.6, [x, y] = pts[pts.length - 1];
        return [x + 30 * scale * u, y + 300 * scale * u * u];
      };
      const end = times[times.length - 1] + 0.6;
      if (t >= d.leave && t <= end) {
        for (let tr = 4; tr >= 1; tr--) {
          const [x, y] = posAt(t - tr * 0.025);
          html += `<i class="ball" style="transform:translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${(1 - tr * 0.15).toFixed(2)});opacity:${(0.4 - tr * 0.08).toFixed(2)}"></i>`;
        }
        const [x, y] = posAt(t);
        html += `<i class="ball" style="transform:translate(${x.toFixed(1)}px,${y.toFixed(1)}px);opacity:${clamp01((end - t) / 0.3).toFixed(2)};box-shadow:0 0 10px #fff,0 0 22px rgb(${GRADE_RGB[kinds[0]]})"></i>`;
      }
      // Each bumper rings, lights and pays out.
      legs.forEach((x, j) => {
        const ba = t - x.land;
        const gi = pick(j);
        jump(gi, ba, 0.3);
        if (ba < 0 || ba > 0.6) return;
        const [gx, gy] = ghostAt(gi, box, 0.5), krgb = KIND_RGB[x.kind], r = (30 + 50 * easeOut(ba / 0.4)) * scale;
        html += `<i class="ring" style="width:${(2 * r).toFixed(0)}px;height:${(2 * r).toFixed(0)}px;transform:translate(${(gx - r).toFixed(1)}px,${(gy - r).toFixed(1)}px);border-color:rgb(${krgb});box-shadow:0 0 14px rgb(${krgb}),inset 0 0 10px rgb(${krgb});opacity:${clamp01(1 - ba / 0.4).toFixed(2)}"></i>`;
        html += popText(gx, gy - 46 * scale, ba, 0.6, krgb, `+${MARK_POINTS[x.kind]}`);
      });
    }
  }

  // C: the bar the pints stand on, and the pints.
  const heat = heatAt(t);
  if (PUB) {
    const r0 = ghosts[0].getBoundingClientRect(), r3 = ghosts[3].getBoundingClientRect();
    html = `<i class="counter" style="left:${r0.left - box.left - 10}px;width:${r3.right - r0.left + 20}px;top:${r0.bottom - box.top + 8 * MUG_PX}px"></i>` + html;
    // A pint still in the air is not on the bar yet; spilled ones are gone.
    const onBar = Math.round(heat / PINT);
    let mugs = '';
    for (let n = 0; n < onBar; n++) {
      const [x, y] = pintAt(n, box);
      mugs += `<i class="pix" style="transform:translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-100%)">${mugSvg}</i>`;
    }
    html = mugs + html;
    // Pints: the glass being filled, its beer rising with every coin.
    if (FX === 'pints') {
      const n = Math.floor(heat / PINT + 1e-6), frac = heat / PINT - n;
      if (n < 16) {
        const [x, y] = pintAt(n, box);
        html = `<i class="pix" style="transform:translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-100%)">${glassSvg}<span style="position:absolute;inset:0;clip-path:inset(${((1 - frac) * 100).toFixed(1)}% 0 0 0)">${mugSvg}</span></i>` + html;
      }
    }
    // Pop and depop.
    for (const p of POPS) {
      const age = t - p.t;
      if (age < 0 || age > 0.8) continue;
      const [gx, gy] = ghostAt(p.gi, box, 0.4);
      html += burst(gx, gy, age, 0.5, 14, p.up ? '182,255,59' : '185,163,212', p.t * 10, scale, p.up ? 60 : 40);
      html += popText(gx, gy - 50 * scale, age, 0.8, p.up ? '182,255,59' : '185,163,212', p.up ? 'Cheers!' : 'Hic!', true);
    }
  }
  if (fire) {
    const [cx, cy] = toBox([CX, CY - 150]);
    const fa = t - fire.start;
    if (fa < 1.4) {
      const sc = fa < 0.25 ? 0.4 + 0.9 * easeOut(fa / 0.25) : 1.3 - 0.3 * clamp01((fa - 0.25) / 0.3);
      html += `<span class="banner fire" style="transform:translate(${cx}px,${(cy - 30 * clamp01(fa - 0.6)).toFixed(1)}px) translate(-50%,-50%) rotate(-4deg) scale(${sc.toFixed(2)});opacity:${clamp01((1.4 - fa) / 0.4).toFixed(2)}">ON FIRE!</span>`;
      html += burst(cx, cy, Math.min(fa, 0.6), 0.6, 18, '255,120,20', 3, scale, 140);
    }
    const da = t - fire.end;
    if (da >= 0 && da < 1.2) {
      html += `<span class="banner doused" style="transform:translate(${cx}px,${(cy - 30 * da).toFixed(1)}px) translate(-50%,-50%);opacity:${(1 - da / 1.2).toFixed(2)}">Doused!</span>`;
      // Smoke where the flames were.
      for (let k = 0; k < 16; k++) {
        const a = (k / 16) * Math.PI * 2, [x, y] = toBox(pt(R1 + 10 + 40 * da, a));
        html += `<i class="px" style="transform:translate(${x.toFixed(1)}px,${(y - 40 * da * scale).toFixed(1)}px) scale(${(1.6 + da).toFixed(2)});background:#6d6080;border-radius:50%;opacity:${(0.6 * (1 - da / 1.2)).toFixed(2)}"></i>`;
      }
    }
    // Pixel flames rising off the ghosts.
    if (fireI > 0) ghosts.forEach((g, gi) => {
      const [gx, gy, r] = ghostAt(gi, box, 0.15);
      for (let k = 0; k < 6; k++) {
        const ph = ((t * 1.6 + rnd(gi, k)) % 1);
        const x = gx + (rnd(k, gi) - 0.5) * r.width * 0.7 + Math.sin(t * 6 + k) * 4, y = gy - ph * 40 * scale;
        html += `<i class="px" style="transform:translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${(1.1 * (1 - ph)).toFixed(2)});background:${ph < 0.4 ? '#ffd23a' : ph < 0.7 ? '#ff7814' : '#ff3b1f'};box-shadow:0 0 6px #ff7814;opacity:${(fireI * (1 - ph)).toFixed(2)}"></i>`;
      }
    });
  }
  fx.innerHTML = html + (svgFx ? `<svg>${svgFx}</svg>` : '');

  // The ghosts light up as the pieces land, and jump when hit.
  ghosts.forEach((g, gi) => {
    const fill = PUB ? (heat >= gi + 1 - 1e-6 ? 1 : 0) : clamp01(heat - gi);
    g.style.setProperty('--fill', fill.toFixed(3));
    g.classList.toggle('is-off', PUB ? fill < 1 : heat - gi < 1);
    let e = landed[gi], tf = '';
    if (PUB) {
      // A ghost pops in with a bounce, and pops off squashed.
      for (const p of POPS) {
        const age = t - p.t;
        if (p.gi !== gi || age < 0 || age > 0.5) continue;
        const u = age / 0.5;
        tf = p.up ? `scale(${(0.3 + 0.7 * easeOut(u) + 0.35 * Math.sin(Math.PI * u)).toFixed(3)})` : `scale(${(1 + 0.4 * (1 - u)).toFixed(3)},${(1 - 0.5 * (1 - u)).toFixed(3)})`;
        e = Math.max(e, 1 - u);
      }
    }
    g.style.transform = tf || (e ? `translateY(${(-10 * e).toFixed(1)}px) scale(${(1 + 0.18 * e).toFixed(3)})` : '');
    g.style.filter = [e ? `brightness(${(1 + e).toFixed(2)})` : '', fireI > 0 ? `drop-shadow(0 0 ${(10 * fireI).toFixed(1)}px #ff7814)` : ''].join(' ').trim();
  });
  document.body.dataset.energy = String(Math.min(3, Math.floor(heat)));

  if (FROZEN === null) requestAnimationFrame(frame);
}
// For recording: render any moment on demand.
window.renderAt = (t) => { FROZEN = t; frame(); };
window.FIRES = FIRES;
document.fonts.ready.then(() => requestAnimationFrame(frame));
</script>
</body>
</html>
