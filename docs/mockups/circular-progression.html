<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Jam · circular progression mockups</title>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../jam/jam.css">
<!--
  Design mockups only, not wired to the game. Two ways to show the chord
  progression as a loop, with the next chord lit and the beat built in:
    ?v=clock  A · the clock: the ring stays put, a hand sweeps it.
    ?v=disc   B · the record: the ring turns under a fixed needle.
  ?n=4 for a four chord loop, ?t=<seconds> to freeze the animation.
-->
<style>
  .mock-wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 0.8rem; }
  .mock-title { font-family: var(--font-display); font-size: 0.7rem; color: var(--lime); text-transform: uppercase; letter-spacing: 0.1em; }
  .mock-sub { color: var(--ivory-dim); font-size: 1.1rem; }
  .mock-tabs { display: flex; gap: 0.6rem; }
  .mock-tabs a { font-family: var(--font-display); font-size: 0.55rem; padding: 0.5rem 0.8rem; border: 2px solid var(--line); border-radius: 8px; color: var(--ivory-dim); text-decoration: none; }
  .mock-tabs a.on { border-color: var(--pink); color: #fff; box-shadow: 0 0 12px rgba(255, 46, 136, 0.5); }
  .stage.mock { min-height: 0; padding: 0.8rem; }
  .wheel { width: min(420px, 100%); display: block; overflow: visible; }

  /* Shared bits of the wheel. */
  .seg { fill: #1d1030; stroke: #4d2f72; stroke-width: 1.5; transition: fill 0.12s; }
  .seg.past { fill: #150b24; }
  .seg.now { fill: rgba(255, 46, 136, 0.28); stroke: var(--pink); stroke-width: 2.5; filter: drop-shadow(0 0 8px var(--pink)); }
  .seg.next { fill: rgba(24, 240, 255, 0.12); stroke: var(--cyan); stroke-width: 2; filter: drop-shadow(0 0 6px var(--cyan)); }
  .seg.next.soon { fill: rgba(24, 240, 255, 0.32); stroke: #fff; filter: drop-shadow(0 0 14px var(--cyan)); }
  .lbl { font-family: var(--font-body); font-size: 30px; fill: var(--ivory-dim); text-anchor: middle; dominant-baseline: central; }
  .lbl.now { fill: #fff; filter: drop-shadow(0 0 4px var(--pink)); }
  .lbl.next { fill: var(--cyan); }
  .lbl.next.soon { fill: #fff; }
  .lbl.past { opacity: 0.45; }
  .tick { fill: #4d2f72; }
  .tick.down { fill: #6d4a99; }
  .tick.lit { fill: var(--cyan); filter: drop-shadow(0 0 4px var(--cyan)); }
  .tick.lit.down { fill: var(--pink); filter: drop-shadow(0 0 5px var(--pink)); }
  .center-chord { font-family: var(--font-body); font-size: 92px; fill: #fff; text-anchor: middle; dominant-baseline: central; filter: drop-shadow(0 0 6px var(--pink)) drop-shadow(0 0 14px var(--pink)); }
  .center-count { fill: var(--orange); filter: drop-shadow(0 0 8px var(--orange)); }
  .center-next { font-family: var(--font-body); font-size: 26px; fill: var(--cyan); text-anchor: middle; }
  .center-small { font-family: 'Press Start 2P', monospace; font-size: 9px; fill: var(--lime); text-anchor: middle; letter-spacing: 1px; }
  .seam { stroke: var(--orange); stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 4px var(--orange)); }

  /* A · the clock hand. */
  .hand { stroke: #fff; stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 6px var(--cyan)); }
  .hand-tip { fill: #fff; }
  .hand-tip.beat { fill: var(--cyan); }
  .hand-tip.down { fill: var(--pink); }
  .hub { fill: #0b0614; stroke: var(--violet); stroke-width: 2; }

  /* B · the record. */
  .vinyl { fill: #0d0716; stroke: #2b1840; stroke-width: 2; }
  .groove { fill: none; stroke: rgba(155, 92, 255, 0.13); stroke-width: 1; }
  .label-disc { fill: #1a0f2b; stroke: var(--pink); stroke-width: 2.5; }
  .label-disc.pulse { stroke: #fff; }
  .needle-arm { stroke: #d8c8ef; stroke-width: 5; stroke-linecap: round; fill: none; }
  .needle-head { fill: #d8c8ef; }
  .needle-light { fill: #2b1840; transition: fill 0.05s; }
  .needle-light.beat { fill: var(--cyan); filter: drop-shadow(0 0 6px var(--cyan)); }
  .needle-light.down { fill: var(--pink); filter: drop-shadow(0 0 8px var(--pink)); }
</style>
</head>
<body>
<div class="smoke"><span></span><span></span><span></span></div>
<div class="app">
  <div class="mock-wrap">
    <div class="mock-tabs">
      <a href="?v=clock" id="tabClock">A · Clock</a>
      <a href="?v=disc" id="tabDisc">B · Record</a>
    </div>
    <div class="mock-title" id="mockTitle"></div>
    <div class="mock-sub" id="mockSub"></div>
    <div class="tune-bar">
      <div class="tune-info">
        <span id="tuneTitle">Autumnal</span>
        <span class="tune-meta">Swing · G minor · 132 bpm</span>
        <span class="tune-chorus" id="tuneChorus">Chorus 1/4</span>
      </div>
    </div>
    <div class="stage mock"><svg class="wheel" id="wheel" viewBox="0 0 420 460"></svg></div>
  </div>
</div>

<script>
const q = new URLSearchParams(location.search);
const V = q.get('v') === 'disc' ? 'disc' : 'clock';
const CHORDS = q.get('n') === '4' ? ['Gm7', 'E♭maj7', 'Cm7', 'D7'] : ['Cm7', 'F7', 'B♭maj7', 'E♭maj7', 'Aø7', 'D7', 'Gm', 'Gm'];
const N = CHORDS.length;
const BEAT = 60 / 132;
const SLOT = 4 * BEAT;
const COUNT_IN = SLOT;            // one bar of count-in, like the game
let FROZEN = q.has('t') ? parseFloat(q.get('t')) : null;

document.getElementById(V === 'disc' ? 'tabDisc' : 'tabClock').classList.add('on');
document.getElementById('mockTitle').textContent = V === 'disc' ? 'B · The record' : 'A · The clock';
document.getElementById('mockSub').textContent = V === 'disc'
  ? 'The loop turns under a fixed needle. The next chord comes in from the right. The needle light is the metronome.'
  : 'The loop stays put and a hand sweeps it, one lap per chorus. The dots on the inside are the beats.';

const SVGNS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('wheel');
const CX = 210, CY = 230;
const el = (tag, attrs, parent = svg) => {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
};
// Angle 0 is twelve o'clock, clockwise.
const pt = (r, a) => [CX + r * Math.sin(a), CY - r * Math.cos(a)];
function arc(r0, r1, a0, a1) {
  const large = a1 - a0 > Math.PI ? 1 : 0;
  const [x0, y0] = pt(r1, a0), [x1, y1] = pt(r1, a1), [x2, y2] = pt(r0, a1), [x3, y3] = pt(r0, a0);
  return `M${x0} ${y0}A${r1} ${r1} 0 ${large} 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 ${large} 0 ${x3} ${y3}Z`;
}
const SPAN = 2 * Math.PI / N;
const GAP = 0.025;

// ---------- build ----------
const segs = [], lbls = [], ticks = [];
let rot, hand, handTip, centerChord, centerNext, centerSmall, needleLight, labelDisc;

if (V === 'clock') {
  const R0 = 128, R1 = 186;
  for (let i = 0; i < N; i++) {
    const a0 = i * SPAN + GAP, a1 = (i + 1) * SPAN - GAP;
    segs.push(el('path', { d: arc(R0, R1, a0, a1), class: 'seg' }));
    const [x, y] = pt((R0 + R1) / 2, (i + 0.5) * SPAN);
    const t = el('text', { x, y, class: 'lbl' }); t.textContent = CHORDS[i]; lbls.push(t);
    for (let b = 0; b < 4; b++) {
      const [tx, ty] = pt(114, i * SPAN + GAP + (b / 4) * (SPAN - 2 * GAP) + 0.02);
      ticks.push(el('circle', { cx: tx, cy: ty, r: b === 0 ? 5 : 3.2, class: 'tick' + (b === 0 ? ' down' : '') }));
    }
  }
  hand = el('line', { x1: CX, y1: CY, x2: CX, y2: CY - 196, class: 'hand' });
  el('circle', { cx: CX, cy: CY, r: 98, class: 'hub' });
  handTip = el('circle', { cx: CX, cy: CY - 196, r: 7, class: 'hand-tip' });
  centerSmall = el('text', { x: CX, y: CY - 52, class: 'center-small' });
  centerChord = el('text', { x: CX, y: CY, class: 'center-chord' });
  centerNext = el('text', { x: CX, y: CY + 62, class: 'center-next' });
} else {
  const R0 = 104, R1 = 180;
  el('circle', { cx: CX, cy: CY, r: 196, class: 'vinyl' });
  rot = el('g', {});
  for (let r = 110; r < 194; r += 7) el('circle', { cx: CX, cy: CY, r, class: 'groove' }, rot);
  for (let i = 0; i < N; i++) {
    const a0 = i * SPAN + GAP, a1 = (i + 1) * SPAN - GAP;
    segs.push(el('path', { d: arc(R0, R1, a0, a1), class: 'seg' }, rot));
    const t = el('text', { class: 'lbl' }, rot); t.textContent = CHORDS[i]; lbls.push(t);
    for (let b = 0; b < 4; b++) {
      const a = i * SPAN + GAP + (b / 4) * (SPAN - 2 * GAP) + 0.02;
      const [tx, ty] = pt(188, a);
      ticks.push(el('circle', { cx: tx, cy: ty, r: b === 0 ? 4.5 : 3, class: 'tick' + (b === 0 ? ' down' : '') }, rot));
    }
  }
  const [sx0, sy0] = pt(R0 - 4, 0), [sx1, sy1] = pt(194, 0);
  el('line', { x1: sx0, y1: sy0, x2: sx1, y2: sy1, class: 'seam' }, rot);
  labelDisc = el('circle', { cx: CX, cy: CY, r: 92, class: 'label-disc' });
  centerSmall = el('text', { x: CX, y: CY - 50, class: 'center-small' });
  centerChord = el('text', { x: CX, y: CY + 4, class: 'center-chord' });
  centerNext = el('text', { x: CX, y: CY + 58, class: 'center-next' });
  // The tonearm comes in from the top right and rests at twelve o'clock.
  el('path', { d: `M400 6 L330 6 Q${CX + 40} 6 ${CX + 8} ${CY - 186}`, class: 'needle-arm' });
  el('circle', { cx: 400, cy: 6, r: 12, class: 'needle-head' });
  el('rect', { x: CX - 9, y: CY - 214, width: 26, height: 30, rx: 5, class: 'needle-head', transform: `rotate(-12 ${CX} ${CY - 200})` });
  needleLight = el('circle', { cx: CX + 4, cy: CY - 199, r: 6, class: 'needle-light' });
}

// ---------- animate ----------
const start = performance.now();
function frame(now) {
  const t = FROZEN !== null ? FROZEN : (now - start) / 1000;
  const song = t - COUNT_IN;
  const counting = song < 0;
  const s = counting ? 0 : song;
  const slot = Math.floor(s / SLOT);
  const k = slot % N;
  const phase = (s % SLOT) / SLOT;                   // 0..1 through the chord
  const beat = counting ? Math.floor(t / BEAT) % 4 : Math.floor(phase * 4);
  const chorus = Math.floor(slot / N) % 4 + 1;
  const next = (k + 1) % N;
  const soon = !counting && phase >= 0.75;

  segs.forEach((g, i) => {
    const past = !counting && ((i - k + N) % N) > N / 2;
    g.setAttribute('class', 'seg' + (!counting && i === k ? ' now' : '') + (i === (counting ? 0 : next) ? ' next' + (soon || (counting && beat === 3) ? ' soon' : '') : ''));
    lbls[i].setAttribute('class', 'lbl' + (!counting && i === k ? ' now' : '') + (i === (counting ? 0 : next) ? ' next' + (soon ? ' soon' : '') : ''));
  });
  ticks.forEach((d, j) => {
    const i = Math.floor(j / 4), b = j % 4;
    const lit = !counting && i === k && b <= beat;
    d.classList.toggle('lit', lit);
  });

  centerChord.innerHTML = counting ? `<tspan class="center-count">${beat + 1}</tspan>` : CHORDS[k];
  // Long names shrink to stay inside the centre.
  centerChord.style.fontSize = counting ? '' : `${Math.min(92, 330 / Math.max(CHORDS[k].length, 1))}px`;
  centerNext.textContent = counting ? `${CHORDS[0]} first` : `then ${CHORDS[next]}`;
  centerSmall.textContent = counting ? 'COUNT-IN' : `CHORUS ${chorus}/4`;
  document.getElementById('tuneChorus').textContent = counting ? 'Count-in' : `Chorus ${chorus}/4`;

  if (V === 'clock') {
    const a = counting ? 0 : (k + phase) * SPAN;
    const [hx, hy] = pt(196, a);
    hand.setAttribute('x2', hx); hand.setAttribute('y2', hy);
    handTip.setAttribute('cx', hx); handTip.setAttribute('cy', hy);
    const fresh = (counting ? (t % BEAT) : (s % BEAT)) < 0.12;
    handTip.setAttribute('class', 'hand-tip' + (fresh ? (beat === 0 ? ' down' : ' beat') : ''));
    handTip.setAttribute('r', fresh ? 10 : 7);
  } else {
    // Turn the record so the current position sits under the needle.
    const a = counting ? 0 : (k + phase) * SPAN;
    const deg = -a * 180 / Math.PI;
    rot.setAttribute('transform', `rotate(${deg} ${CX} ${CY})`);
    // Labels stay upright while the record turns.
    lbls.forEach((t, i) => {
      const [x, y] = pt(142, (i + 0.5) * SPAN);
      t.setAttribute('x', x); t.setAttribute('y', y);
      t.setAttribute('transform', `rotate(${-deg} ${x} ${y})`);
    });
    const fresh = (counting ? (t % BEAT) : (s % BEAT)) < 0.12;
    needleLight.setAttribute('class', 'needle-light' + (fresh ? (beat === 0 ? ' down' : ' beat') : ''));
    labelDisc.classList.toggle('pulse', fresh && beat === 0);
    // The record bumps on each beat.
    const since = counting ? t % BEAT : s % BEAT;
    const bump = 1 + 0.025 * Math.max(0, 1 - since / 0.16);
    svg.style.transform = `scale(${bump})`;
  }
  if (FROZEN === null) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// For recording: render any moment on demand.
window.renderAt = (t) => { FROZEN = t; frame(); };
</script>
</body>
</html>
